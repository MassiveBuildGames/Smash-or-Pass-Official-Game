<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Smash or Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0D0B14;
    --bg-soft: #161222;
    --panel: #1D1830;
    --line: #322A47;
    --text: #F4F1FA;
    --muted: #948AAE;
    --smash: #2ED573;
    --smash-dark: #1B9E52;
    --pass: #FF4B5C;
    --pass-dark: #C22F3D;
    --gold: #FFC93C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(46,213,115,0.10), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(255,75,92,0.12), transparent 45%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow:hidden;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    position:relative;
  }
  .screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .screen.active{
    display:flex;
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- LOADING SCREEN ---------- */
  #screen-loading{
    align-items:center;
    justify-content:center;
    gap:28px;
  }
  .logo-anim{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:baseline;
    gap:14px;
    font-family:'Anton',sans-serif;
    letter-spacing:1px;
  }
  .logo-anim .word{
    font-size:44px;
    opacity:0;
    transform:translateY(24px) scale(.85);
    animation:wordIn .6s cubic-bezier(.2,.8,.3,1.3) forwards;
  }
  .word-smash{ color:var(--smash); animation-delay:.1s; }
  .word-or{ color:var(--muted); font-family:'Inter',sans-serif; font-size:20px; font-style:italic; animation-delay:.45s; }
  .word-pass{ color:var(--pass); animation-delay:.7s; }
  @keyframes wordIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .loading-bar{
    width:180px;
    height:4px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .loading-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--smash),var(--pass));
    animation:fillBar 2.1s ease forwards .3s;
    border-radius:4px;
  }
  @keyframes fillBar{ to{ width:100%; } }

  /* ---------- HOME SCREEN ---------- */
  #screen-home{ padding:18px 18px 24px; }
  .home-header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
  }
  .home-header .counter{ justify-self:start; }
  .home-header .play-btn{ justify-self:center; }
  .home-header .clear-btn{ justify-self:end; }
  .counter{
    font-size:13px;
    color:var(--muted);
    font-weight:600;
    background:var(--panel);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
  }
  .counter b{ color:var(--text); }
  .play-btn{
    font-family:'Anton',sans-serif;
    letter-spacing:1px;
    font-size:16px;
    background:linear-gradient(135deg,var(--smash),var(--smash-dark));
    color:#04210F;
    border:none;
    padding:10px 26px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(46,213,115,0.35);
    transition:transform .15s ease, opacity .2s ease, box-shadow .2s ease;
  }
  .play-btn:active{ transform:scale(.95); }
  .play-btn:disabled{
    opacity:.35;
    box-shadow:none;
    cursor:not-allowed;
  }
  .clear-btn{
    font-size:12px;
    font-weight:700;
    color:var(--pass);
    background:transparent;
    border:1px solid rgba(255,75,92,0.4);
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .2s ease;
  }
  .clear-btn:active{ background:rgba(255,75,92,0.15); }

  .home-title{
    font-family:'Anton',sans-serif;
    font-size:30px;
    text-align:center;
    margin:18px 0 4px;
    letter-spacing:.5px;
  }
  .home-title span:first-child{ color:var(--smash); }
  .home-title span:last-child{ color:var(--pass); }
  .home-sub{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-bottom:18px;
  }

  .grid-wrap{
    flex:1;
    overflow-y:auto;
    padding-bottom:10px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
    gap:10px;
  }
  .tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--line);
    cursor:pointer;
  }
  .tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .tile-overlay{
    position:absolute;
    inset:0;
    background:rgba(13,11,20,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .15s ease;
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
  }
  .tile:active .tile-overlay{ opacity:1; }
  .tile-add{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border:2px dashed var(--line);
    background:var(--bg-soft);
    color:var(--muted);
  }
  .tile-add .plus{
    font-size:26px;
    line-height:1;
    color:var(--gold);
    font-weight:800;
  }
  .tile-add span{ font-size:10px; font-weight:600; }
  .tile-add:active{ background:var(--panel); }

  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:40px;
    padding:0 20px;
    line-height:1.5;
  }

  /* ---------- MODALS ---------- */
  .modal-overlay{
    position:absolute;
    inset:0;
    background:rgba(5,4,9,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    width:100%;
    max-width:320px;
    text-align:center;
  }
  .modal img{
    width:100%;
    max-height:260px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:16px;
  }
  .modal p{
    font-size:14px;
    color:var(--text);
    margin:6px 0 18px;
    line-height:1.5;
  }
  .modal-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .modal-actions button{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px;
    border-radius:12px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{ background:var(--gold); color:#2B1E00; }
  .btn-danger{ background:var(--pass); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line) !important; }

  /* ---------- SHUFFLE SCREEN ---------- */
  #screen-shuffle{
    align-items:center;
    justify-content:center;
    gap:22px;
  }
  .spinner{
    width:56px;
    height:56px;
    border-radius:50%;
    border:5px solid var(--line);
    border-top-color:var(--smash);
    border-right-color:var(--pass);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .shuffle-text{
    font-size:14px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.3px;
  }

  /* ---------- GAME SCREEN ---------- */
  #screen-game{
    align-items:center;
    justify-content:flex-start;
    padding:22px 20px;
    position:relative;
  }
  .progress{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:1px;
    margin-bottom:18px;
  }
  .card-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .photo-frame{
    position:relative;
    width:100%;
    max-width:320px;
    aspect-ratio:3/4;
    border-radius:20px;
    overflow:hidden;
    background:var(--panel);
    border:3px solid var(--line);
    box-shadow:0 16px 40px rgba(0,0,0,0.45);
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-frame.shake{ animation:shake .5s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    20%{ transform:translateX(-9px) rotate(-2.5deg); }
    40%{ transform:translateX(9px) rotate(2.5deg); }
    60%{ transform:translateX(-7px) rotate(-1.5deg); }
    80%{ transform:translateX(7px) rotate(1.5deg); }
  }
  .stamp{
    position:absolute;
    top:50%; left:50%;
    width:84px; height:84px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:44px;
    font-weight:900;
    opacity:0;
    transform:translate(-50%,-50%) scale(2) rotate(-15deg);
  }
  .stamp.show{ animation:stampPop .35s ease forwards; }
  @keyframes stampPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(2) rotate(-15deg); }
    60%{ opacity:1; transform:translate(-50%,-50%) scale(.85) rotate(-15deg); }
    100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-15deg); }
  }
  .stamp-smash{ color:var(--smash); background:rgba(13,20,15,0.75); border:4px solid var(--smash); }
  .stamp-pass{ color:var(--pass); background:rgba(20,13,15,0.75); border:4px solid var(--pass); }

  .prompt{
    font-family:'Anton',sans-serif;
    font-size:24px;
    margin:18px 0 22px;
    letter-spacing:.5px;
  }
  .decision-buttons{
    display:flex;
    gap:16px;
    width:100%;
    max-width:340px;
  }
  .decision-buttons button{
    flex:1;
    font-family:'Anton',sans-serif;
    letter-spacing:1px;
    font-size:19px;
    padding:16px 0;
    border-radius:16px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .decision-buttons button:active{ transform:scale(.94); }
  .decision-buttons button:disabled{ opacity:.5; }
  .btn-smash{ background:linear-gradient(135deg,var(--smash),var(--smash-dark)); color:#04210F; }
  .btn-pass{ background:linear-gradient(135deg,var(--pass),var(--pass-dark)); color:#2B0509; }

  .flash-text{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-family:'Anton',sans-serif;
    font-size:64px;
    letter-spacing:2px;
    opacity:0;
    z-index:40;
    pointer-events:none;
    text-shadow:0 6px 24px rgba(0,0,0,0.5);
  }
  .flash-text.show{ animation:flashPop 1.1s ease forwards; }
  @keyframes flashPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-6deg); }
    15%{ opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(-6deg); }
    28%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-6deg); }
    78%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-6deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1) rotate(-6deg); }
  }
  .flash-smash{ color:var(--smash); }
  .flash-pass{ color:var(--pass); }

  /* ---------- RESULTS SCREEN ---------- */
  #screen-results{
    align-items:center;
    justify-content:center;
    padding:24px;
    gap:26px;
  }
  .results-title{
    font-family:'Anton',sans-serif;
    font-size:32px;
    letter-spacing:1px;
  }
  .results-panels{
    display:flex;
    gap:14px;
    width:100%;
    max-width:380px;
  }
  .panel{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 12px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .panel-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--muted);
  }
  .panel-count{
    font-family:'Anton',sans-serif;
    font-size:40px;
  }
  .panel-smash .panel-count{ color:var(--smash); }
  .panel-pass .panel-count{ color:var(--pass); }
  .view-btn{
    font-size:12px;
    font-weight:700;
    padding:9px 14px;
    border-radius:20px;
    border:none;
    cursor:pointer;
    background:var(--bg-soft);
    color:var(--text);
    border:1px solid var(--line);
  }
  .view-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .play-again{
    font-family:'Anton',sans-serif;
    font-size:18px;
    letter-spacing:1px;
    background:var(--gold);
    color:#2B1E00;
    border:none;
    padding:14px 40px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(255,201,60,0.3);
  }
  .play-again:active{ transform:scale(.96); }

  /* ---------- VIEWER SCREEN ---------- */
  #screen-viewer{
    background:#000;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .viewer-close{
    position:absolute;
    top:18px; left:18px;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    z-index:5;
  }
  .viewer-counter{
    position:absolute;
    top:24px; right:20px;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
  }
  .viewer-image-wrap{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:70px 20px;
  }
  .viewer-image-wrap img{
    max-width:100%;
    max-height:100%;
    border-radius:14px;
    object-fit:contain;
  }
  .viewer-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px; height:46px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:none;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    z-index:5;
  }
  .viewer-prev{ left:12px; }
  .viewer-next{ right:12px; }
  .viewer-arrow:active{ background:rgba(255,255,255,0.22); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- LOADING SCREEN -->
  <div class="screen active" id="screen-loading">
    <div class="logo-anim">
      <span class="word word-smash">SMASH</span>
      <span class="word word-or">or</span>
      <span class="word word-pass">PASS</span>
    </div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen" id="screen-home">
    <div class="home-header">
      <div class="counter"><b id="photoCount">0</b>/100</div>
      <button class="play-btn" id="playBtn" disabled>PLAY</button>
      <button class="clear-btn" id="clearBtn">CLEAR ALL</button>
    </div>
    <h1 class="home-title"><span>Smash</span> or <span>Pass</span></h1>
    <p class="home-sub">Add up to 100 photos, then hit play</p>
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
      <p class="empty-note" id="emptyNote">Tap the + tile to add your first photo from your library, files, or camera.</p>
    </div>
  </div>

  <!-- SHUFFLE / LOADING FOR GAME -->
  <div class="screen" id="screen-shuffle">
    <div class="spinner"></div>
    <div class="shuffle-text">Shuffling the lineup&hellip;</div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screen-game">
    <div class="progress" id="gameProgress">1 / 1</div>
    <div class="card-stage">
      <div class="photo-frame" id="photoFrame">
        <img id="gamePhoto" src="" alt="">
        <div class="stamp stamp-smash" id="stampSmash">&#10003;</div>
        <div class="stamp stamp-pass" id="stampPass">&#10005;</div>
      </div>
      <h2 class="prompt">Smash or Pass?</h2>
    </div>
    <div class="decision-buttons">
      <button class="btn-smash" id="smashBtn">SMASH</button>
      <button class="btn-pass" id="passBtn">PASS</button>
    </div>
  </div>
  <div class="flash-text" id="flashText"></div>

  <!-- RESULTS SCREEN -->
  <div class="screen" id="screen-results">
    <h1 class="results-title">Results</h1>
    <div class="results-panels">
      <div class="panel panel-smash">
        <div class="panel-label">SMASHED</div>
        <div class="panel-count" id="smashCount">0</div>
        <button class="view-btn" id="viewSmashBtn">View Images</button>
      </div>
      <div class="panel panel-pass">
        <div class="panel-label">PASSED</div>
        <div class="panel-count" id="passCount">0</div>
        <button class="view-btn" id="viewPassBtn">View Images</button>
      </div>
    </div>
    <button class="play-again" id="playAgainBtn">Play Again</button>
  </div>

  <!-- VIEWER SCREEN -->
  <div class="screen" id="screen-viewer">
    <button class="viewer-close" id="viewerCloseBtn">&#10005;</button>
    <div class="viewer-counter" id="viewerCounter">1 / 1</div>
    <button class="viewer-arrow viewer-prev" id="viewerPrevBtn">&#8249;</button>
    <div class="viewer-image-wrap"><img id="viewerImage" src="" alt=""></div>
    <button class="viewer-arrow viewer-next" id="viewerNextBtn">&#8250;</button>
  </div>

  <!-- EDIT PHOTO MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <img id="editPreview" src="" alt="">
      <div class="modal-actions">
        <button class="btn-primary" id="changePhotoBtn">Change Photo</button>
        <button class="btn-danger" id="deletePhotoBtn">Delete</button>
        <button class="btn-ghost" id="closeEditBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- CLEAR ALL CONFIRM MODAL -->
  <div class="modal-overlay" id="clearModal">
    <div class="modal">
      <p>Clear all photos? This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn-danger" id="confirmClearBtn">Clear All</button>
        <button class="btn-ghost" id="cancelClearBtn">Cancel</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  <input type="file" id="changeFileInput" accept="image/*" style="display:none">

</div>

<script>
(function(){
  const MAX_PHOTOS = 100;
  let photos = [];       // {id, src}
  let order = [];
  let currentIndex = 0;
  let smashed = [];
  let passed = [];
  let editingId = null;
  let viewerList = [];
  let viewerIndex = 0;
  let busy = false;

  const $ = (id) => document.getElementById(id);

  const screens = document.querySelectorAll('.screen');
  function showScreen(id){
    screens.forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  function uid(){ return 'p' + Date.now() + Math.random().toString(36).slice(2,9); }

  function fileToDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- INITIAL LOADING ---------- */
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => { showScreen('screen-home'); }, 2400);
    renderGrid();
  });

  /* ---------- HOME / GRID ---------- */
  function renderGrid(){
    const grid = $('grid');
    grid.innerHTML = '';

    photos.forEach(p => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.id = p.id;
      tile.innerHTML = `<img src="${p.src}" alt=""><div class="tile-overlay"><span>Edit</span></div>`;
      tile.addEventListener('click', () => openEditModal(p.id));
      grid.appendChild(tile);
    });

    if (photos.length < MAX_PHOTOS){
      const addTile = document.createElement('div');
      addTile.className = 'tile tile-add';
      addTile.id = 'addTile';
      addTile.innerHTML = `<div class="plus">+</div><span>Add</span>`;
      addTile.addEventListener('click', () => $('fileInput').click());
      grid.appendChild(addTile);
    }

    $('photoCount').textContent = photos.length;
    $('playBtn').disabled = photos.length === 0;
    $('emptyNote').style.display = photos.length === 0 ? 'block' : 'none';
  }

  $('fileInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    const room = MAX_PHOTOS - photos.length;
    const toAdd = files.slice(0, room);
    for (const file of toAdd){
      try{
        const src = await fileToDataURL(file);
        photos.push({ id: uid(), src });
      }catch(err){ /* skip failed read */ }
    }
    renderGrid();
  });

  /* ---------- EDIT MODAL ---------- */
  function openEditModal(id){
    editingId = id;
    const p = photos.find(x => x.id === id);
    if (!p) return;
    $('editPreview').src = p.src;
    $('editModal').classList.add('show');
  }
  function closeEditModal(){
    $('editModal').classList.remove('show');
    editingId = null;
  }
  $('closeEditBtn').addEventListener('click', closeEditModal);
  $('editModal').addEventListener('click', (e) => { if (e.target.id === 'editModal') closeEditModal(); });

  $('changePhotoBtn').addEventListener('click', () => $('changeFileInput').click());
  $('changeFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || !editingId) return;
    try{
      const src = await fileToDataURL(file);
      const p = photos.find(x => x.id === editingId);
      if (p){ p.src = src; $('editPreview').src = src; renderGrid(); }
    }catch(err){ /* ignore */ }
  });

  $('deletePhotoBtn').addEventListener('click', () => {
    photos = photos.filter(x => x.id !== editingId);
    closeEditModal();
    renderGrid();
  });

  /* ---------- CLEAR ALL ---------- */
  $('clearBtn').addEventListener('click', () => {
    if (photos.length === 0) return;
    $('clearModal').classList.add('show');
  });
  $('cancelClearBtn').addEventListener('click', () => $('clearModal').classList.remove('show'));
  $('confirmClearBtn').addEventListener('click', () => {
    photos = [];
    renderGrid();
    $('clearModal').classList.remove('show');
  });

  /* ---------- SHUFFLE / START GAME ---------- */
  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  $('playBtn').addEventListener('click', () => {
    if (photos.length === 0) return;
    showScreen('screen-shuffle');
    setTimeout(() => {
      order = shuffle(photos);
      currentIndex = 0;
      smashed = [];
      passed = [];
      showScreen('screen-game');
      loadCard();
    }, 1300);
  });

  /* ---------- GAME ---------- */
  function loadCard(){
    if (currentIndex >= order.length){ finishGame(); return; }
    const p = order[currentIndex];
    $('gamePhoto').src = p.src;
    $('gameProgress').textContent = `${currentIndex + 1} / ${order.length}`;
    $('photoFrame').classList.remove('shake');
    $('stampSmash').classList.remove('show');
    $('stampPass').classList.remove('show');
    $('smashBtn').disabled = false;
    $('passBtn').disabled = false;
    busy = false;
  }

  function decide(type){
    if (busy) return;
    busy = true;
    $('smashBtn').disabled = true;
    $('passBtn').disabled = true;

    const p = order[currentIndex];
    const flash = $('flashText');

    if (type === 'smash'){
      smashed.push(p);
      $('photoFrame').classList.add('shake');
      $('stampSmash').classList.add('show');
      flash.textContent = 'SMASH';
      flash.className = 'flash-text flash-smash show';
    } else {
      passed.push(p);
      $('stampPass').classList.add('show');
      flash.textContent = 'PASS';
      flash.className = 'flash-text flash-pass show';
    }

    setTimeout(() => {
      flash.classList.remove('show');
      currentIndex++;
      loadCard();
    }, 1100);
  }

  $('smashBtn').addEventListener('click', () => decide('smash'));
  $('passBtn').addEventListener('click', () => decide('pass'));

  /* ---------- RESULTS ---------- */
  function finishGame(){
    $('smashCount').textContent = smashed.length;
    $('passCount').textContent = passed.length;
    $('viewSmashBtn').disabled = smashed.length === 0;
    $('viewPassBtn').disabled = passed.length === 0;
    showScreen('screen-results');
  }

  $('playAgainBtn').addEventListener('click', () => {
    renderGrid();
    showScreen('screen-home');
  });

  /* ---------- VIEWER ---------- */
  function openViewer(list){
    if (!list.length) return;
    viewerList = list;
    viewerIndex = 0;
    renderViewer();
    showScreen('screen-viewer');
  }
  function renderViewer(){
    $('viewerImage').src = viewerList[viewerIndex].src;
    $('viewerCounter').textContent = `${viewerIndex + 1} / ${viewerList.length}`;
  }
  $('viewSmashBtn').addEventListener('click', () => openViewer(smashed));
  $('viewPassBtn').addEventListener('click', () => openViewer(passed));
  $('viewerPrevBtn').addEventListener('click', () => {
    viewerIndex = (viewerIndex - 1 + viewerList.length) % viewerList.length;
    renderViewer();
  });
  $('viewerNextBtn').addEventListener('click', () => {
    viewerIndex = (viewerIndex + 1) % viewerList.length;
    renderViewer();
  });
  $('viewerCloseBtn').addEventListener('click', () => showScreen('screen-results'));

})();
</script>
</body>
</html>
